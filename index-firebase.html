<!DOCTYPE html>
<html lang="no">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>🍷 Vinbibliotek</title>

<!-- Firebase SDK (compat-versjon — fungerer med globale variabler, ingen modules) -->
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f7f4ee;color:#2a2520;min-height:100vh;}
.container{max-width:980px;margin:0 auto;padding:1rem 1rem 4rem;}

/* HEADER */
.lib-header{padding:.6rem 0;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;border-bottom:1px solid #e4dfd6;}
.lib-title{font-size:20px;font-weight:600;letter-spacing:-.3px;color:#2a2520;}
.lib-subtitle{font-size:11px;color:#9a8f84;margin-top:1px;}
.sync-status{font-size:11px;padding:3px 10px;border-radius:20px;font-weight:500;}
.sync-ok{background:#e4f4ec;color:#2d6a2d;}
.sync-wait{background:#fef3dc;color:#996600;}
.sync-off{background:#f0ede8;color:#9a8f84;}
.sync-err{background:#fdecea;color:#a32d2d;}

/* TOOLBAR */
.toolbar{background:#fff;border:1px solid #e4dfd6;border-radius:12px;padding:10px 14px;margin-bottom:12px;display:flex;flex-direction:column;gap:8px;}
.toolbar-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
.toolbar-label{font-size:10px;font-weight:600;color:#c0b8b0;letter-spacing:.07em;text-transform:uppercase;white-space:nowrap;min-width:48px;}
.search-input{flex:1;min-width:160px;font-size:13px;padding:7px 14px;border:1px solid #e4dfd6;border-radius:20px;background:#f9f8f6;color:#2a2520;outline:none;}
.search-input::placeholder{color:#c0b8b0;}
.search-input:focus{border-color:#9a8f84;background:#fff;}
.toggle-btn{font-size:11px;padding:5px 13px;border-radius:20px;border:1px solid #e4dfd6;background:#fff;color:#9a8f84;cursor:pointer;transition:all .13s;user-select:none;}
.toggle-btn:hover{background:#f0ede8;color:#5c5248;}
.toggle-btn.active-type-red{background:#8B1A1A;color:#fff;border-color:#8B1A1A;}
.toggle-btn.active-type-white{background:#7a6200;color:#fff;border-color:#7a6200;}
.toggle-btn.active-type-rose{background:#c4506a;color:#fff;border-color:#c4506a;}
.toggle-btn.active-type-other{background:#888;color:#fff;border-color:#888;}
.toggle-btn.active-status{background:#2a2520;color:#fff;border-color:#2a2520;}
.sort-select{font-size:11px;padding:5px 10px;border:1px solid #e4dfd6;border-radius:20px;background:#fff;color:#5c5248;cursor:pointer;outline:none;}
.sort-dir-btn{font-size:14px;padding:4px 10px;border-radius:20px;border:1px solid #e4dfd6;background:#fff;color:#9a8f84;cursor:pointer;line-height:1.4;}
.sort-dir-btn:hover{background:#f0ede8;}
.btn-small{font-size:11px;padding:6px 13px;border-radius:20px;border:1px solid #e4dfd6;background:#fff;color:#5c5248;cursor:pointer;white-space:nowrap;}
.btn-small:hover{background:#f0ede8;}
.btn-primary{background:#8B1A1A;color:#fff;border-color:#8B1A1A;}
.btn-primary:hover{background:#a01f20;}
.btn-backup{background:#e6f0fb;color:#185fa5;border-color:#b5d4f4;}
.btn-prices{background:#e4f4ec;color:#2d6a2d;border-color:#b8d9b8;}
.section-label{font-size:10px;font-weight:600;color:#c0b8b0;letter-spacing:.08em;text-transform:uppercase;margin:1.25rem 0 8px;}

/* ── DESKTOP: editorial list layout ── */
.grid{display:flex;flex-direction:column;gap:2px;}
.wine-type-section{margin-bottom:20px;}

/* WINE CARD — desktop list row */
.wine-card{background:#fff;border:1px solid #e4dfd6;display:grid;grid-template-columns:76px 1fr;align-items:stretch;cursor:pointer;transition:background .12s;overflow:hidden;}
.wine-card:first-child{border-radius:10px 10px 0 0;}
.wine-card:last-child{border-radius:0 0 10px 10px;}
.wine-card:only-child{border-radius:10px;}
.wine-card+.wine-card{border-top:none;}
.wine-card:hover{background:#ebe7df;}
.wine-card.dragging{opacity:.4;outline:2px dashed #c0b8b0;}
.wine-card.drag-over{outline:2px dashed #8B1A1A;}
.drag-handle{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:18px;height:18px;display:none;align-items:center;justify-content:center;background:rgba(0,0,0,.08);border-radius:3px;cursor:grab;font-size:12px;color:#c0b8b0;z-index:2;}
.sort-custom .drag-handle{display:flex;}
.sort-custom .wine-card{cursor:grab;}
.sort-custom .card-body{padding-right:32px;} /* leave room for the drag handle */

/* card image area — desktop */
.card-img-area{position:relative;width:76px;height:88px;background:#ffffff;display:flex;align-items:center;justify-content:center;border-right:1px solid #e4dfd6;flex-shrink:0;}
.card-img-area img{max-width:100%;max-height:76px;object-fit:contain;position:relative;z-index:1;}

/* card body — desktop */
.card-body{padding:10px 16px;display:flex;align-items:center;gap:16px;background:#ffffff;}
.card-body-left{flex:1;}
.card-name{font-size:13px;font-weight:500;line-height:1.3;margin-bottom:2px;color:#2a2520;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
.card-sub{font-size:11px;color:#9a8f84;margin-bottom:5px;}
.card-dice-row{display:inline-flex;align-items:center;gap:3px;margin-right:8px;}
.card-status-row{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap;}
.card-footer{display:flex;align-items:center;justify-content:flex-end;gap:4px;flex-direction:column;text-align:right;}
.price-val{font-size:15px;font-weight:500;color:#2a2520;}
.price-date{font-size:9px;color:#c0b8b0;display:block;}

/* STATUS BADGES */
.status-badge{font-size:9px;padding:2px 7px;border-radius:9px;font-weight:600;white-space:nowrap;}
.badge-har{background:#e8f4e8;color:#2d6a2d;}
.badge-bestill{background:#e6f0fb;color:#185fa5;}

/* PROFILE CIRCLES in card */
.profile-circles{display:flex;gap:6px;align-items:center;}
.profile-circle-wrap{display:flex;flex-direction:row;align-items:center;gap:3px;}
.profile-circle-wrap.empty{visibility:hidden;pointer-events:none;}
.profile-label{font-size:9px;color:#9a8f84;font-weight:500;text-transform:uppercase;letter-spacing:.04em;}
.profile-label-full{font-size:10px;color:#9a8f84;}

/* ── MOBILE: horizontal card layout ── */
@media(max-width:640px){
  .wine-card{display:flex;grid-template-columns:none;border-radius:10px!important;border-top:1px solid #e4dfd6!important;margin-bottom:0;}
  .wine-card+.wine-card{margin-top:8px;}
  .grid{gap:0;}
  .wine-type-section{margin-bottom:16px;}
  .card-img-area{width:80px;height:90px;flex-shrink:0;border-right:1px solid #f0ede8;border-radius:0;}
  .card-img-area img{max-height:72px;}
  .card-body{flex:1;padding:9px 12px;display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;gap:0;background:#f0ede5;}
  .card-body-left{width:100%;}
  .card-name{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;}
  .card-footer{flex-direction:row;justify-content:space-between;align-items:center;width:100%;margin-top:6px;}
  .price-val{font-size:13px;}
  .card-status-row{margin-top:4px;}
}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:1000;padding:12px;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:520px;max-height:90vh;overflow-y:auto;border:1px solid #e4dfd6;box-shadow:0 16px 48px rgba(0,0,0,.15);}

/* Desktop popup: two columns */
@media(min-width:641px){
  .modal{display:grid;grid-template-columns:180px 1fr;max-height:85vh;}
  .modal-img-area{grid-row:1/3;width:180px;min-height:300px;height:auto;border-radius:14px 0 0 14px;border-right:1px solid #e4dfd6;flex-direction:column;justify-content:center;padding:20px 14px;background:#fff;}
  .modal-img-area img{max-height:200px;padding:0;cursor:zoom-in;}
  .modal-type-badge{display:none;}
  .modal-body{grid-column:2;padding:1rem 1.1rem .5rem;background:#f0ede5;}
  .modal-actions{grid-column:2;padding:.5rem 1.1rem 1rem;background:#f0ede5;}
}

/* Mobile popup: single column */
@media(max-width:640px){
  .modal{display:block;}
  .modal-img-area{width:100%;height:220px;border-radius:14px 14px 0 0;display:flex;align-items:center;justify-content:center;overflow:hidden;background:#ffffff;}
  .modal-img-area img{max-height:200px;padding:8px;cursor:zoom-in;}
}

.modal-img-area{position:relative;display:flex;align-items:center;justify-content:center;}
.modal-img-area img{object-fit:contain;transition:transform .15s;}
.modal-type-badge{position:absolute;bottom:9px;left:9px;width:32px;height:32px;border-radius:50%;background:#fff;border:1px solid #e4dfd6;display:flex;align-items:center;justify-content:center;}
.modal-body{padding:1rem 1.1rem;}
.modal-title{font-size:17px;font-weight:600;margin-bottom:2px;line-height:1.3;color:#2a2520;}
.modal-meta{font-size:11px;color:#9a8f84;margin-bottom:12px;}
.detail-grid{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:12px;margin-bottom:10px;align-items:center;}
.dl{color:#9a8f84;font-weight:500;}.dv{color:#2a2520;}
.desc-text{font-size:12px;color:#6a5e56;line-height:1.65;margin:8px 0;border-top:1px solid #e4dfd6;padding-top:8px;}
.tasting-label{font-size:10px;color:#9a8f84;margin-bottom:3px;margin-top:8px;font-weight:500;text-transform:uppercase;letter-spacing:.05em;}
textarea.tasting-note{width:100%;font-size:12px;padding:8px 10px;border-radius:8px;border:1px solid #e4dfd6;color:#2a2520;background:#f9f8f6;resize:vertical;min-height:55px;font-family:inherit;outline:none;}
.stars6-edit{display:flex;gap:4px;margin:5px 0 10px;}
.star6{font-size:22px;cursor:pointer;color:#e4dfd6;line-height:1;transition:color .1s;}
.star6.lit{color:#c8a830;}.star6:hover{color:#c8a830;}
.modal-actions{display:flex;gap:7px;flex-wrap:wrap;padding:0 1.1rem 1.1rem;}
.action-btn{font-size:11px;padding:6px 14px;border-radius:20px;border:1px solid #e4dfd6;background:#fff;color:#5c5248;cursor:pointer;font-family:inherit;}
.action-btn:hover{background:#f0ede8;}
.action-btn.green{background:#e8f4e8;color:#2d6a2d;border-color:#b8d9b8;}
.action-btn.red{background:#fdecea;color:#a32d2d;border-color:#f7c1c1;}
.action-btn.blue{background:#e6f0fb;color:#185fa5;border-color:#b5d4f4;}
.action-btn.amber{background:#fef3dc;color:#996600;border-color:#f0d080;}
.action-btn.dirty{background:#e8f4e8!important;color:#2d6a2d!important;border-color:#b8d9b8!important;font-weight:600;}
.edit-form-section{border-top:1px solid #f0ede8;padding-top:10px;margin-top:6px;}
.edit-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
.edit-row input,.edit-row select,.edit-row textarea{flex:1;min-width:100px;font-size:12px;padding:7px 10px;border:1px solid #e4dfd6;border-radius:8px;font-family:inherit;outline:none;background:#fff;color:#2a2520;}
.add-form{background:#f9f8f6;border-radius:10px;border:1px solid #e4dfd6;padding:.9rem 1.1rem;margin-bottom:1.25rem;}
.add-form h3{font-size:13px;font-weight:600;margin-bottom:9px;color:#2a2520;}
.form-row{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:7px;}
.form-row input,.form-row select,.form-row textarea{flex:1;min-width:100px;font-size:12px;padding:7px 10px;border:1px solid #e4dfd6;border-radius:8px;font-family:inherit;outline:none;background:#fff;color:#2a2520;}
.form-row input::placeholder,.form-row textarea::placeholder{color:#c0b8b0;}
.update-banner{font-size:11px;padding:6px 11px;background:#f0ede8;border-radius:8px;margin-bottom:9px;color:#7a6e66;}
.count-info{font-size:11px;color:#c0b8b0;margin-bottom:6px;}
.empty{text-align:center;padding:2.5rem;color:#c0b8b0;font-size:13px;}
code{background:#f0ede8;padding:1px 4px;border-radius:3px;font-size:10px;color:#7a6e66;}

/* LIGHTBOX */
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:2000;display:flex;align-items:center;justify-content:center;cursor:zoom-out;}
.lightbox img{max-width:95vw;max-height:95vh;object-fit:contain;border-radius:4px;}

/* SEARCH */
.search-wrap{position:relative;flex:1;min-width:160px;display:flex;align-items:center;}
.search-wrap input{width:100%;padding-right:28px;}
.search-clear{position:absolute;right:10px;font-size:14px;color:#c0b8b0;cursor:pointer;display:none;line-height:1;background:none;border:none;padding:0;}
.search-clear:hover{color:#9a8f84;}

/* SETUP */
#setup-screen{background:#f7f4ee!important;}

/* ADD FORM search results */
#nw-search-results a,#nw-search-results div{color:#2a2520;}
#nw-prof-preview{color:#2d6a2d;}

/* EDIT inline fields */
.ef-label-style{font-size:10px;font-weight:600;color:#9a8f84;text-transform:uppercase;letter-spacing:.07em;margin-bottom:4px;}
.ef-input-style{width:100%;background:#fff;border:1px solid #e4dfd6;border-radius:8px;padding:8px 12px;font-size:13px;color:#2a2520;}
</style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="login-screen" style="display:none;position:fixed;inset:0;background:#f5f4f0;z-index:3000;align-items:center;justify-content:center;padding:1rem;">
  <div style="background:#fff;border-radius:16px;border:1px solid #e4dfd6;width:100%;max-width:380px;padding:2rem;box-shadow:0 8px 32px rgba(0,0,0,.1);text-align:center;">
    <div style="font-size:36px;margin-bottom:10px;">🍷</div>
    <div style="font-size:22px;font-weight:600;margin-bottom:6px;">Vinbibliotek</div>

    <div id="login-error" style="font-size:12px;color:#a32d2d;margin-bottom:12px;min-height:16px;"></div>
    <button id="login-btn" onclick="signInWithGoogle()" style="width:100%;font-size:14px;font-weight:500;padding:11px;border-radius:24px;border:1px solid #dadce0;background:#fff;color:#3c4043;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;font-family:inherit;">
      <svg width="18" height="18" viewBox="0 0 18 18" xmlns="http://www.w3.org/2000/svg"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Logg inn med Google
    </button>
    <div style="font-size:11px;color:#c0b8b0;margin-top:18px;line-height:1.5;">Kun konti som er gitt tilgang i Firebase-reglene kan logge inn.</div>
  </div>
</div>

<div id="app-root">
<div class="container">
  <div class="lib-header">
    <div>
      <div class="lib-title">🍷 Vinbibliotek</div>
      <div class="lib-subtitle" id="storage-info">— av 100 kB</div>
    </div>
    <div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;">
      <span id="sync-badge" class="sync-status sync-off">⏳ Laster...</span>
      <button class="btn-small btn-prices" id="update-prices-btn" onclick="updatePricesFromVMP()">↻ Oppdater priser</button>
      <button class="btn-small btn-backup" onclick="downloadBackup()">⬇ Backup</button>
      <button class="btn-small" onclick="openSettings()" title="Innstillinger">⚙</button>
      <button class="btn-small btn-primary" onclick="toggleManualForm()">+ Legg til vin</button>
    </div>
  </div>

  <div id="update-banner"></div>

  <div class="toolbar">
    <div class="toolbar-row">
      <span class="toolbar-label">Søk</span>
      <div class="search-wrap">
        <input class="search-input" id="search" placeholder="Navn, drue, smak, mat..."
          oninput="onSearchInput()" onkeydown="onSearchKey(event)" style="flex:1;min-width:0;"/>
        <button class="search-clear" id="search-clear" onclick="clearSearch()">✕</button>
      </div>
    </div>
    <div class="toolbar-row">
      <span class="toolbar-label">Type</span>
      <button class="toggle-btn" id="tb-red"   onclick="toggleType('red')">🍷 Rød</button>
      <button class="toggle-btn" id="tb-white" onclick="toggleType('white')">🥂 Hvit</button>
      <button class="toggle-btn" id="tb-rose"  onclick="toggleType('rose')">🌸 Rosé</button>
      <button class="toggle-btn" id="tb-other" onclick="toggleType('other')">🫙 Andre</button>
      <button class="toggle-btn" id="tb-food"  onclick="openFoodFilter()">🍽 Mat</button>
    </div>
    <div class="toolbar-row">
      <span class="toolbar-label">Status</span>
      <button class="toggle-btn" id="tb-alle"    onclick="toggleStatus('alle')">Alle</button>
      <button class="toggle-btn" id="tb-har"     onclick="toggleStatus('har')">Har</button>
      <button class="toggle-btn" id="tb-bestill" onclick="toggleStatus('bestill')">Bestill</button>
    </div>
    <div class="toolbar-row">
      <span class="toolbar-label">Sorter</span>
      <select class="sort-select" id="sort-by" onchange="onSortChange()">
        <option value="recent" selected>Sist endret</option>
        <option value="custom">Egendefinert</option>
        <option value="name">Alfabetisk</option>
        <option value="price">Pris</option>
        <option value="expert">Terningkast</option>
        <option value="rating">Mine stjerner</option>
        <option value="fylde">Fylde</option>
        <option value="friskhet">Friskhet</option>
        <option value="sodme">Sødme</option>
        <option value="garvestoff">Garvestoff</option>
      </select>
      <button class="sort-dir-btn" id="sort-dir-btn" onclick="toggleSortDir()" title="Bytt retning">↓</button>
      <button class="toggle-btn" onclick="resetFilters()">✕ Nullstill</button>
    </div>
  </div>

  <div id="add-form-container" style="display:none;"></div>
  <div id="wine-list"></div>
  <div id="modal-container"></div>
  <div id="lightbox-container"></div>
</div>
</div>

<script>
/* ── CONFIG ── */
const LS_KEY     = 'vinbibliotek_wines_fb_v1';   // ny nøkkel for Firebase-versjonen
const LS_ORDER   = 'vinbibliotek_order_fb_v1';   // ny nøkkel for Firebase-versjonen
const VMP_IMG    = 'https://bilder.vinmonopolet.no/cache/300x300-0/';
const VMP_PROXY  = 'https://vinmonopol-proxy.esandal.workers.dev/';
const VIV_IMG    = 'https://images.vivino.com/thumbs/';

/* ── FIREBASE CONFIG ──
 * apiKey er IKKE en hemmelighet — den identifiserer prosjektet ditt for klientsiden.
 * Sikkerheten kommer fra Realtime Database sikkerhetsregler som er låst til din uid. */
const firebaseConfig = {
  apiKey: "AIzaSyAocfAtdEKdTAuU8xup8N5HaoNDUjL9mQ4",
  authDomain: "vinbibliotek-5b8e6.firebaseapp.com",
  databaseURL: "https://vinbibliotek-5b8e6-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "vinbibliotek-5b8e6",
  storageBucket: "vinbibliotek-5b8e6.firebasestorage.app",
  messagingSenderId: "968577829325",
  appId: "1:968577829325:web:0d596576647005715d5c84"
};

// Initialiser Firebase ved sideinnlasting
firebase.initializeApp(firebaseConfig);
const fbAuth = firebase.auth();
const fbDb   = firebase.database();
// Sett auth-persistens til LOCAL slik at innlogging huskes mellom sesjoner.
// (Default er allerede LOCAL, men eksplisitt er trygt.)
fbAuth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).catch(()=>{});

let currentUser=null;          // Firebase user-objektet (eller null)
let winesListener=null;        // referanse til /wines listener (for å kunne fjerne den)
let orderListener=null;        // referanse til /order listener
let connListener=null;         // referanse til .info/connected listener
let isOnline=true;             // siste rapporterte tilkoblingsstatus

/* ── STATE ── */
let wines=[];
let customOrder=[]; // array of wine ids in custom order
let activeTypes=new Set();
let activeStatuses=new Set(['alle']); // default filter: show all wines
let activeFoods=new Set(); // selected food categories for filter (AND-logic)
let sortBy='recent';
let sortAsc=false; // false = descending for most fields
let showManual=false;
let selectedId=null;
let editRating=0;

/* ── FOOD CATEGORIES (from Vinmonopolet) ── */
const KNOWN_FOODS = [
  'Aperitiff/avec','Småvilt og fugl','Storvilt','Storfe','Lam og sau','Lam',

];
// Aliases for smart migration of legacy string food data. Lowercase keys.
// Longer/more specific entries listed first so they win the greedy match.
const FOOD_ALIASES = [
  ['lam og sau', 'Lam og sau'],
  ['småvilt og fugl', 'Småvilt og fugl'],
  ['krydret/asiatisk/spicy', 'Krydret/asiatisk/spicy'],

  ['bbq/grillmat', 'Bbq/grillmat'],
  ['aperitiff', 'Aperitiff/avec'],
  ['aperitif', 'Aperitiff/avec'],
  ['avec', 'Aperitiff/avec'],
  ['sushi', 'Sushi/sashimi'],
  ['sashimi', 'Sushi/sashimi'],
  ['pizza', 'Pizza/pasta'],
  ['pasta', 'Pizza/pasta'],
  ['bbq', 'Bbq/grillmat'],

].sort((a,b) => b[0].length - a[0].length);

/* Convert a legacy food string (or array) into a deduplicated array of canonical
 * categories. Unknown tokens are dropped. Used by migrateWine and VMP-import. */
function migrateFood(input){
  if(Array.isArray(input)){
    return Array.from(new Set(
      input.map(v=>{
        const norm=String(v).toLowerCase().trim();
        const direct=KNOWN_FOODS.find(k=>k.toLowerCase()===norm);
        if(direct) return direct;
        const alias=FOOD_ALIASES.find(([from])=>from===norm);
        return alias?alias[1]:null;
      }).filter(Boolean)
    ));
  }
  if(!input||typeof input!=='string') return [];
  let working=' '+input.toLowerCase().trim().replace(/\s+/g,' ')+' ';
  const found=new Set();
  for(const [alias,canonical] of FOOD_ALIASES){
    const escaped=alias.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
    const re=new RegExp(`(^|[\\s,;·•])${escaped}($|[\\s,;·•])`,'i');
    if(re.test(working)){
      found.add(canonical);
      working=working.replace(new RegExp(`(^|[\\s,;·•])${escaped}($|[\\s,;·•])`,'gi'),' $1$2 ');
    }
  }
  return Array.from(found);
}

/* Render chip grid for food selection. Used in edit mode, add form and food filter overlay.
 * containerId = DOM id of the host element. onClickFn = name of global toggle handler. */
function foodChipsHTML(selected, onClickFn){
  const sel=new Set(selected||[]);
  return KNOWN_FOODS.map(f=>{
    const isOn=sel.has(f);
    const style=isOn
      ? 'background:#8B1A1A;color:#fff;border-color:#8B1A1A;'
      : 'background:#fff;color:#5c5248;border-color:#e4dfd6;';
    return `<button type="button" class="food-chip" data-food="${f.replace(/"/g,'&quot;')}" data-on="${isOn?'1':'0'}" onclick="${onClickFn}(this)"
      style="font-size:11px;padding:5px 11px;border-radius:20px;border:1px solid;cursor:pointer;font-family:inherit;${style}">${f}</button>`;
  }).join('');
}

/* ── PRESENTATION PROMPT ──
 * Builds a Claude-ready prompt the user can paste into a Claude chat to generate
 * a short, engaging wine presentation. The intro/examples block is static (the
 * same every time); the wine-data block is built per wine.
 * In edit mode, getEffectiveWine reads live form values so unsaved edits are
 * reflected in the copied prompt — saves a round-trip if user just typed
 * something into the smak/desc fields. */
const PRESENTATION_PROMPT_BASE = `Du er en vinformidler som skriver korte, engasjerende presentasjoner av viner for et bredt publikum — folk uten spesielle vinkunnskaper, men også vinkjennere som kan stikke innom og lese. Presentasjonen skal være sann, interessant og lett å lytte til.

MALEN — 4 KORTE DELER (~80-100 ord totalt, 60-90 sek å lese høyt):

1) KROKEN (1-2 setninger): Fang oppmerksomheten med noe konkret og uventet. Variér mellom: klimaendringer i regionen, geologi/jordsmonn (sand, kalk, vulkansk, skifer), mikroklima (høyde, fjell, hav-påvirkning), produsentens historie, sammenligning med en kjent drue, en kuriositet ved druen eller navnet, regionens status (i fremvekst, "skjult Burgund", på vei opp).

2) HVORFOR DEN ER VERDT OPPMERKSOMHETEN (1-2 setninger): Det spesielle — vinmakerens filosofi, en klassifisering, uvanlig produksjonsmetode, sjelden drueblanding, gammel vinmark. Pris nevnes KUN hvis det er et ekte godt kjøp — ellers er det kjedelig.

3) SMAKEN (1-2 setninger): Folkelig, kroppslig språk. Konkrete bær/frukt/krydder. Unngå svevende vinjargong ("fjernt drag av tobakk", "fokusert avslutning", "mineralsk"). Bruk sammenligninger som hjelper ("ikke tung", "ikke sur", "glir ned uten å gjøre nummer ut av seg", "sitter lenge på tungen", "våkner opp av første slurken").

4) TIL HVA (1 setning): Mat, anledning eller temperatur. Skrives som en fet linje på slutten.

VIKTIG OM VARIASJON: Hvis brukeren ber om regenerering, velg en ANNEN innfallsvinkel i kroken (del 1) og hvorfor (del 2) enn standard sammenligning. Tenk geologi, mikroklima, produsenthistorie, kuriositeter — vær kreativ.

TRE EKSEMPLER PÅ STIL OG TONE:

EKSEMPEL 1 — Terra d'Alter ALF Alfrocheiro 2024
> Alfrocheiro er en portugisisk drue de fleste aldri har hørt om — men den har blitt kalt **Portugals svar på Pinot Noir**, og det merkes med en gang. Mannen bak vinen er Peter Bright, en australsk "flying winemaker" som slo seg ned i Portugal på 80-tallet og har vært med på å skape moderne portugisisk vin.
>
> Druene kommer fra Portalegre — Alentejos høyeste og kjøligste vinmark — så selv om regionen ellers er kjent for solsteik, beholder vinen en friskhet og eleganse man sjelden får til denne prisen.
>
> Modne kirsebær og plommer, med en liten krydderkant bak. Lett og saftig — glir ned uten å gjøre nummer ut av seg. Sånn rødvin man fort tar to glass av uten å tenke seg om.
>
> **Funker til alt fra pizza og pasta til kylling og lett lammegryte.**

EKSEMPEL 2 — Malvirà Nudo Langhe Nebbiolo 2022
> Like nordvest for Barolo ligger Roero, hvor nebbiolo-druene vokser i **sandjord** i stedet for kalk. Det gjør vinen lettere, mer parfymert og mer transparent enn de muskuløse Barolo-vinene — uten å miste den klassiske nebbiolo-eleganesen.
>
> Navnet "Nudo" — naken — er produsentens credo: minimal inngripen, ingen tunge fat, la druen og jorda snakke. Roero har lenge stått i Barolos skygge, men er på rask vei opp, og dette er en presis introduksjon til hva regionen kan.
>
> Kirsebær og rose, med en jordnær avslutning. Litt mer å bryne tennene på enn en hverdags-Langhe — men aldri tung. Sitter lenge på tungen og fortjener å bli smakt på.
>
> **Lammeskank, soppgryte eller en lagret hard ost.**

EKSEMPEL 3 — Seckinger Deidesheim Mäushöhle Riesling Erste Lage 2025
> Mäushöhle betyr bokstavelig talt **"musehullet"** — et lite sjarmerende navn for en av Pfalz' mest anerkjente vinmarker. Den er klassifisert som Erste Lage, omtrent Tysklands svar på Burgunds Premier Cru, og undergrunnen av sandstein og kalk er det som gir Riesling-druen sin karakteristiske stramhet.
>
> Seckinger-brødrene har på få år blitt blant Tysklands mest snakkede unge produsenter. De spontanfermenterer — bruker villgjær fra vinmarka i stedet for kjøpt gjær — og lar dermed vinmarken stå tydeligere fram i glasset.
>
> Lime og fersken, knusktørr og frisk uten å være sur. Setter i gang munnen og sitter lenge etterpå. Sånn vin som våkner opp av første slurken.
>
> **Perfekt til skalldyr, fisk med smør — eller bare som en alenedrikk på terrassen.**

NÅ — SKRIV EN PRESENTASJON AV DENNE VINEN:
`;

const TYPE_LABELS_NB = {red:'Rødvin', white:'Hvitvin', rose:'Rosévin', other:'Annet'};

/* In edit mode, read live form values so unsaved edits are reflected in the copied prompt.
 * Falls back to stored wine values for fields not currently in the form. */
function getEffectiveWine(w){
  if(!document.getElementById('ed-name')) return w; // not in edit mode
  const getVal = id => {
    const el = document.getElementById(id);
    return el ? el.value.trim() : undefined;
  };
  const eff = {...w};
  const strOverrides = {name:'ed-name', grape:'ed-grape', region:'ed-region', type:'ed-type', taste:'ed-taste', desc:'ed-desc'};
  Object.entries(strOverrides).forEach(([prop, id]) => {
    const v = getVal(id);
    if(v !== undefined && v !== '') eff[prop] = v;
  });
  const priceStr = getVal('ed-price');
  if(priceStr !== undefined) {
    const p = parseFloat(priceStr);
    eff.price = isNaN(p) ? null : p;
  }
  const scoreStr = getVal('ed-score');
  if(scoreStr !== undefined) eff.expertScore = scoreStr ? parseInt(scoreStr) : null;
  const srcStr = getVal('ed-src');
  if(srcStr) eff.expertSource = srcStr;
  if(document.getElementById('ed-food-chips')) eff.food = readFoodChips('ed-food-chips');
  return eff;
}

function buildPresentationPrompt(w){
  const lines = [];
  lines.push(`Navn: ${w.name || '—'}`);
  if(w.grape)  lines.push(`Drue: ${w.grape}`);
  if(w.region) lines.push(`Region: ${w.region}`);
  lines.push(`Type: ${TYPE_LABELS_NB[w.type] || 'Rødvin'}`);
  if(w.price)  lines.push(`Pris: ${Math.round(w.price)} kr`);
  if(w.taste)  lines.push(`Smak (fra Vinmonopolet): ${w.taste}`);
  if(w.desc)   lines.push(`Beskrivelse: ${w.desc}`);
  if(Array.isArray(w.food) && w.food.length) lines.push(`Mat: ${w.food.join(', ')}`);
  if(w.expertScore) lines.push(`Terningkast: ${w.expertScore} (${w.expertSource || 'GV'})`);
  return PRESENTATION_PROMPT_BASE + '\n' + lines.join('\n') + '\n\nSvar med kun selve presentasjonen — ingen forklaring, ingen forord, ingen avsluttende kommentarer. Bruk **fet** markering for nøkkelord og avsluttende mat-linje, akkurat som eksemplene.';
}

async function copyPresentationPrompt(wineId){
  const w = wines.find(x => x.id === wineId);
  if(!w) return;
  const effective = getEffectiveWine(w);
  const prompt = buildPresentationPrompt(effective);
  const btn = document.getElementById('copy-prompt-btn');
  const originalText = btn ? btn.textContent : '';
  const setFeedback = (msg, ok=true) => {
    if(!btn) return;
    btn.textContent = msg;
    btn.style.background = ok ? '#e8f4e8' : '#fdecea';
    btn.style.color = ok ? '#2d6a2d' : '#a32d2d';
    setTimeout(() => {
      btn.textContent = originalText;
      btn.style.background = '';
      btn.style.color = '';
    }, 2500);
  };
  // Modern Clipboard API (requires HTTPS or localhost)
  if(navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(prompt);
      setFeedback('✓ Kopiert! Lim inn i Claude');
      return;
    } catch(e) { /* fall through to execCommand fallback */ }
  }
  // Fallback for older browsers / non-HTTPS contexts (e.g. older iOS Safari)
  try {
    const ta = document.createElement('textarea');
    ta.value = prompt;
    ta.style.position = 'fixed';
    ta.style.top = '0';
    ta.style.left = '0';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.focus();
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    setFeedback(ok ? '✓ Kopiert! Lim inn i Claude' : '⚠ Kopiering feilet', ok);
  } catch(e) {
    setFeedback('⚠ Kopiering feilet', false);
  }
}

/* Render presentation text with minimal markdown — bold (**...**) and line breaks.
 * HTML-escape first so user-pasted text can't inject markup. */
function renderPresentation(text){
  if(!text) return '';
  return text
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/\*\*([^*\n]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\n/g,'<br>');
}

/* ── SYNC ── */
function setSyncBadge(s,t){const el=document.getElementById('sync-badge');if(!el)return;el.className='sync-status sync-'+s;el.textContent=t;}

/* Migrate legacy fields:
 *  - w.status (string) → w.har / w.bestill (booleans). Old 'meh' etc. dropped.
 *  - w.food (string) → w.food (array of canonical categories).
 * Returns true if any field was actually changed. */
function migrateWine(w){
  if(!w) return false;
  let changed=false;
  // Legacy status field
  if(w.status){
    if(w.status==='har') w.har=true;
    else if(w.status==='bestill') w.bestill=true;
    delete w.status;
    changed=true;
  }
  // Legacy food string → array
  if(typeof w.food==='string'){
    w.food=migrateFood(w.food);
    changed=true;
  } else if(!Array.isArray(w.food)){
    if(w.food!=null){ w.food=[]; changed=true; }
    else if(w.food===undefined){ w.food=[]; /* not really a change, just normalising */ }
  } else {
    const cleaned=migrateFood(w.food);
    if(JSON.stringify(cleaned)!==JSON.stringify(w.food)){
      w.food=cleaned;
      changed=true;
    }
  }
  return changed;
}

function loadLocal(){
  try{
    const r=localStorage.getItem(LS_KEY);wines=r?JSON.parse(r):[];
    // Migrate fields. Migration is idempotent.
    wines.forEach(w=>migrateWine(w));
    // Strip localImg (base64) — vi tar ikke vare på lokale bilder i Firebase-versjonen heller
    wines.forEach(w=>{ if(w && w.localImg) delete w.localImg; });
    saveLocal();
    const o=localStorage.getItem(LS_ORDER);customOrder=o?JSON.parse(o):[];
  }catch(e){wines=[];customOrder=[];}
}
function saveLocal(){
  try{localStorage.setItem(LS_KEY,JSON.stringify(wines));localStorage.setItem(LS_ORDER,JSON.stringify(customOrder));}catch(e){}
}

/* ── FIREBASE SYNC ──
 * Real-time listeners erstatter fetch/push fra JSONBin-versjonen. Endringer skrives
 * direkte til Firebase via ref().set(); listeners holder lokal state synkronisert
 * når noen enhet (inkludert denne) gjør en endring. Firebase håndterer offline-køing
 * automatisk via SDK-ets innebygde minnecache. */

let pendingWrites = 0; // antall skriveoperasjoner i flukt (for badge)

function refreshBadge(){
  if(!currentUser){ setSyncBadge('off','⏳ Ikke logget inn'); return; }
  if(!isOnline){ setSyncBadge('wait','⏳ Offline'); return; }
  if(pendingWrites>0){ setSyncBadge('wait','⟳ Lagrer...'); return; }
  setSyncBadge('ok','✓ Synkronisert');
}

/* Konverter et Firebase-snapshot til en wines-array. Firebase lagrer arrays som objekter
 * med numeriske nøkler; vi håndterer begge formater for å være robuste. */
function snapToWinesArray(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(Boolean);
  if(typeof v === 'object') return Object.values(v);
  return [];
}
function snapToOrderArray(v){
  if(!v) return [];
  if(Array.isArray(v)) return v.filter(x=>x!=null);
  if(typeof v === 'object') return Object.values(v).filter(x=>x!=null);
  return [];
}

function attachListeners(){
  if(winesListener) return; // allerede koblet til
  // .info/connected — Firebase sin spesielle node som sier om klienten er tilkoblet
  connListener = fbDb.ref('.info/connected');
  connListener.on('value', snap => {
    isOnline = !!snap.val();
    refreshBadge();
  });
  // /wines real-time listener — fyrer ved initial last + hver endring fra hvilken som helst enhet
  winesListener = fbDb.ref('wines');
  winesListener.on('value', snap => {
    const newWines = snapToWinesArray(snap.val());
    newWines.forEach(migrateWine);
    wines = newWines;
    saveLocal();
    render();
  }, err => {
    console.error('[firebase] /wines listener error', err);
    setSyncBadge('err','⚠ '+String(err.message||err.code||err).slice(0,60));
  });
  // /order real-time listener
  orderListener = fbDb.ref('order');
  orderListener.on('value', snap => {
    customOrder = snapToOrderArray(snap.val());
    ensureOrder();
    saveLocal();
    render();
  }, err => {
    console.error('[firebase] /order listener error', err);
  });
}

function detachListeners(){
  if(winesListener){ winesListener.off(); winesListener = null; }
  if(orderListener){ orderListener.off(); orderListener = null; }
  if(connListener){ connListener.off(); connListener = null; }
  pendingWrites = 0;
}

/* Skriv én vin til Firebase. Returnerer en Promise som resolves når skriving er bekreftet
 * av server (men Firebase ACK'er optimistisk umiddelbart offline). */
async function pushWineToFirebase(wine){
  pendingWrites++; refreshBadge();
  try{
    await fbDb.ref('wines/' + wine.id).set(wine);
  }catch(e){
    console.error('[firebase] save wine failed', e);
    setSyncBadge('err','⚠ '+String(e.message||'lagring feilet').slice(0,60));
    throw e;
  }finally{
    pendingWrites--; refreshBadge();
  }
}

async function pushOrderToFirebase(){
  pendingWrites++; refreshBadge();
  try{
    await fbDb.ref('order').set(customOrder);
  }catch(e){
    console.error('[firebase] save order failed', e);
    setSyncBadge('err','⚠ '+String(e.message||'rekkefølge feilet').slice(0,60));
    throw e;
  }finally{
    pendingWrites--; refreshBadge();
  }
}

async function removeWineFromFirebase(id){
  pendingWrites++; refreshBadge();
  try{
    await fbDb.ref('wines/' + id).remove();
  }catch(e){
    console.error('[firebase] delete wine failed', e);
    setSyncBadge('err','⚠ '+String(e.message||'sletting feilet').slice(0,60));
    throw e;
  }finally{
    pendingWrites--; refreshBadge();
  }
}

/* Bulk-skriv mange viner samtidig (brukes av updatePricesFromVMP).
 * Bruker multi-path update for å gjøre én round-trip i stedet for N. */
async function pushMultipleWinesToFirebase(wineArray){
  pendingWrites++; refreshBadge();
  try{
    const updates = {};
    wineArray.forEach(w => { updates['wines/' + w.id] = w; });
    await fbDb.ref().update(updates);
  }catch(e){
    console.error('[firebase] bulk save failed', e);
    setSyncBadge('err','⚠ '+String(e.message||'bulk-lagring feilet').slice(0,60));
    throw e;
  }finally{
    pendingWrites--; refreshBadge();
  }
}

async function saveWine(wine){
  wine.updatedAt=Date.now();
  const idx=wines.findIndex(w=>w.id===wine.id);
  const isNew = idx<0;
  if(idx>=0) wines[idx]=wine;
  else { wines.push(wine); customOrder.push(wine.id); }
  saveLocal();
  render();
  try{
    await pushWineToFirebase(wine);
    if(isNew) await pushOrderToFirebase();
  }catch(e){/* badge speiler allerede feilen */}
}

/* Seed-funksjon: skriv default-vinene til Firebase i én operasjon.
 * Kjøres kun når Firebase er tom ved første pålogging. */
async function seedDefaultsToFirebase(){
  const now=Date.now();
  const seeded=defaultWines.map(w=>{ const c={...w}; migrateWine(c); c.updatedAt=now; return c; });
  const winesObj={}; seeded.forEach(w=>{ winesObj[w.id]=w; });
  const order=seeded.map(w=>w.id);
  pendingWrites++; refreshBadge();
  try{
    await fbDb.ref().update({wines:winesObj, order});
  }catch(e){
    console.error('[firebase] seed failed', e);
    setSyncBadge('err','⚠ '+String(e.message||'seed feilet').slice(0,60));
  }finally{
    pendingWrites--; refreshBadge();
  }
}

function ensureOrder(){

  ids.forEach(id=>{if(!customOrder.includes(id))customOrder.push(id);});

function toggleSubmenuFoodChip(btn){ toggleFoodChipGeneric(btn); }
function closeEditFoodSubmenu(apply){
  const overlay=document.getElementById('food-submenu-overlay');
  if(!overlay) return;
  if(apply){
    const after=readFoodChips('food-submenu-chips');
    const before=overlay._foodBefore||[];
    // Compare sorted arrays — order doesn't matter for set semantics
    const changed=JSON.stringify([...before].sort())!==JSON.stringify([...after].sort());
    if(changed){
      // Write back to the hidden canonical state node
      const hidden=document.getElementById('ed-food-chips');
      if(hidden) hidden.innerHTML=foodChipsHTML(after,'toggleEditFoodChip');
      const cnt=document.getElementById('ed-food-count');
      if(cnt) cnt.textContent=after.length;
      markDirty();
    }
  }
  overlay.remove();
  popOverlayIfTop();
}

/* ── STATUS LOGIC ──
 * Each wine has independent booleans w.har and w.bestill.
 * Filters: 'alle' = no filter (show all). 'har' or 'bestill' = require that flag.
 * If both 'har' and 'bestill' selected: wine must have BOTH (AND logic). */
function wineMatchesFilter(w){
  if(activeStatuses.has('alle')) return true;
  if(activeStatuses.has('har')     && !w.har)     return false;
  if(activeStatuses.has('bestill') && !w.bestill) return false;

/* ── PROFILE CIRCLES ── */
function profileCircleSVG(val, color, sz=18){
  // val is on 1-12 scale from Vinmonopolet
  if(val===null||val===undefined) return '';
  const r=sz/2, cx=r, cy=r, radius=r-1.5;
  const pct = (val-1)/11; // convert 1-12 to 0-1
  if(pct>=1){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="${color}" stroke="#ddd" stroke-width="1"/>
    </svg>`;
  }
  if(pct<=0){
    return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">
      <circle cx="${cx}" cy="${cy}" r="${radius}" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    </svg>`;
  }
  const angle=pct*Math.PI*2;
  const x=cx+radius*Math.sin(angle);
  const y=cy-radius*Math.cos(angle);
  const large=pct>0.5?1:0;
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">
    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="#f5f5f5" stroke="#ddd" stroke-width="1"/>
    <path d="M${cx},${cy} L${cx},${cy-radius} A${radius},${radius} 0 ${large},1 ${x},${y} Z" fill="${color}"/>
    <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="#ddd" stroke-width="1"/>
  </svg>`;
}
function profileCirclesHTML(w, small=true){
  const sz=small?14:22;
  // Profile slots depend on wine type:
  // white/rose: FYL, FRI, SØD
  // red:        FYL, FRI, GAR (garvestoff)
  // other:      FYL, FRI
  let profiles;
  if(w.type==='red'){
    profiles=[
      {key:'fylde',      label:'FYL', labelFull:'Fylde',       color:'#8B5CF6'},
      {key:'friskhet',   label:'FRI', labelFull:'Friskhet',    color:'#06B6D4'},
      {key:'garvestoff', label:'GAR', labelFull:'Garvestoff',  color:'#EF4444'},
    ];
  } else if(w.type==='white'||w.type==='rose'){
    profiles=[
      {key:'fylde',    label:'FYL', labelFull:'Fylde',    color:'#8B5CF6'},
      {key:'friskhet', label:'FRI', labelFull:'Friskhet', color:'#06B6D4'},
      {key:'sodme',    label:'SØD', labelFull:'Sødme',    color:'#F59E0B'},
    ];
  } else {
    return ''; // Andre: ingen profilsirkler
  }
  const anyVal=profiles.some(p=>w[p.key]!=null);
  if(!anyVal) return '';
  const circles=profiles.map(p=>{
    const val=w[p.key];
    const isEmpty=val==null;
    const labelStr=small
      ? p.label
      : `${p.labelFull} <span style="color:#bbb;font-size:10px;">${val!=null?val+'/12':''}</span>`;
    return `<div class="profile-circle-wrap${isEmpty?' empty':''}">
      ${isEmpty?`<div style="width:${sz}px;height:${sz}px;"></div>`:profileCircleSVG(val,p.color,sz)}
      <span class="${small?'profile-label':'profile-label-full'}">${labelStr}</span>
    </div>`;
  }).join('');
  return `<div class="profile-circles">${circles}</div>`;
}

/* ── DICE ── */
function diceSVG(n,sz=18){
  const dp={1:[[.5,.5]],2:[[.3,.3],[.7,.7]],3:[[.3,.3],[.5,.5],[.7,.7]],4:[[.3,.3],[.7,.3],[.3,.7],[.7,.7]],5:[[.3,.3],[.7,.3],[.5,.5],[.3,.7],[.7,.7]],6:[[.3,.25],[.7,.25],[.3,.5],[.7,.5],[.3,.75],[.7,.75]]};
  const face=dp[Math.min(6,Math.max(1,Math.round(n)))]||dp[1];
  const r=Math.round(sz*.14),dr=Math.round(sz*.09);
  const dots=face.map(([x,y])=>`<circle cx="${Math.round(x*sz)}" cy="${Math.round(y*sz)}" r="${dr}" fill="#1a1a1a"/>`).join('');
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg" style="flex-shrink:0;"><rect x="1" y="1" width="${sz-2}" height="${sz-2}" rx="${r}" fill="#fff" stroke="#ccc" stroke-width="1.2"/>${dots}</svg>`;
}

/* ── FILTER + SORT ── */
function getFiltered(){
  const q=document.getElementById('search').value.toLowerCase().trim();
  // status filter logic
  // default (nothing selected): show all except boring
  // if 'boring' selected: show boring
  // if 'pending' selected: show pending
  // if 'all' selected: show 'all' status
  // combinations work independently
  let list=wines.filter(w=>{
    const typeOk=activeTypes.size===0||activeTypes.has(w.type);
    const statusOk=wineMatchesFilter(w);
    // Food filter: wine must include ALL selected food categories (AND-logic)
    const wineFoods=Array.isArray(w.food)?w.food:[];
    const foodOk=activeFoods.size===0||Array.from(activeFoods).every(f=>wineFoods.includes(f));
    // Search: food is array now, join for substring search
    const foodSearchText=wineFoods.join(' ');
    const searchOk=!q||[w.name,w.grape,w.region,w.taste,w.desc,w.note,w.presentation,foodSearchText].some(s=>s&&s.toLowerCase().includes(q));
    return typeOk&&statusOk&&foodOk&&searchOk;
  });

  if(sortBy==='custom'){
    // sort by customOrder, preserving relative order of other types if filtered
    const orderMap={};customOrder.forEach((id,i)=>orderMap[id]=i);
    list.sort((a,b)=>(orderMap[a.id]??9999)-(orderMap[b.id]??9999));
    return list;
  }

  list.sort((a,b)=>{
    let va,vb;
    if(sortBy==='name'){va=a.name.toLowerCase();vb=b.name.toLowerCase();}
    else if(sortBy==='price'){va=a.price||0;vb=b.price||0;}
    else if(sortBy==='expert'){va=a.expertScore||0;vb=b.expertScore||0;}
    else if(sortBy==='rating'){va=a.rating||0;vb=b.rating||0;}
    else if(sortBy==='recent'){va=a.updatedAt||0;vb=b.updatedAt||0;}
    else if(sortBy==='fylde'){va=a.fylde||0;vb=b.fylde||0;}
    else if(sortBy==='friskhet'){va=a.friskhet||0;vb=b.friskhet||0;}
    else if(sortBy==='sodme'){va=a.sodme||0;vb=b.sodme||0;}
    else if(sortBy==='garvestoff'){va=a.garvestoff||0;vb=b.garvestoff||0;}
    else{va=a.id;vb=b.id;}
    if(va<vb)return sortAsc?-1:1;
    if(va>vb)return sortAsc?1:-1;
    // Tiebreaker: use id so wines with identical primary value get a stable
    // order. Multiply by sort direction so the toggle still flips visibly
    // when most/all values are equal (e.g. "Sist endret" right after migration).
    return (a.id-b.id)*(sortAsc?1:-1);
  });
  return list;
}

function render(){
  const list=getFiltered();
  const isCustom=sortBy==='custom';
  const groups={red:[],white:[],rose:[],other:[]};
  list.forEach(w=>(groups[w.type]||[]).push(w));
  let html=`<div class="count-info">${list.length} vin${list.length!==1?'er':''} vist</div>`;

  if(!isCustom||activeTypes.size>0){
    // flat list or sorted — no type grouping
    if(list.length){
      html+=`<div class="grid${isCustom?' sort-custom':''}">${list.map(w=>cardHTML(w,isCustom)).join('')}</div>`;
    } else {
      html+='<div class="empty">Ingen viner funnet.</div>';
    }
  } else {
    // grouped by type in custom order
    ['red','white','rose','other'].forEach(t=>{
      if(!groups[t].length)return;
      html+=`<div class="section-label">${typeHeading(t)}</div>`;
      html+=`<div class="grid sort-custom">${groups[t].map(w=>cardHTML(w,true)).join('')}</div>`;
    });
    if(!list.length)html+='<div class="empty">Ingen viner funnet.</div>';
  }
  document.getElementById('wine-list').innerHTML=html;
  if(isCustom)initDrag();
  updateStorageInfo();
}

/* ── STORAGE INFO ──
 * Computes the size of the JSON payload that would be sent to JSONBin (wines + order)
 * and renders it in the subtitle. Colors:
 *   0–79 kB:  default grey
 *   80–89 kB: amber (approaching the 100 kB JSONBin Free limit)
 *   90–100 kB: red (very close)
 *   >100 kB:  red + explicit overflow message
 * Called from render() so it stays in sync with all wine-list mutations. */
function updateStorageInfo(){
  const el=document.getElementById('storage-info'); if(!el) return;
  const bytes=JSON.stringify({wines,order:customOrder}).length;
  const kb=Math.round(bytes/1024);
  const n=wines.length;
  let color='#9a8f84', extra='';
  if(kb>100){ color='#a32d2d'; extra=' — max of 100 kB exceeded!'; }
  else if(kb>=90){ color='#a32d2d'; }
  else if(kb>=80){ color='#996600'; }
  el.style.color=color;
  el.textContent=`${kb} av 100 kB (${n})${extra}`;
}

function typeGlowRgb(type){
  const map={red:'139,26,26',white:'184,150,12',rose:'196,80,106',other:'150,150,150'};
  return map[type]||'150,150,150';
}

function cardHTML(w,draggable=false){
  // Status badges (har/bestill) — shown only when active.
  // Desktop: appended to line-3 (next to dice/profile/stars).
  // Mobile: a dedicated row .card-status-row between line-3 and the price footer.
  const harBadge     = w.har     ? '<span class="status-badge badge-har">Har</span>'         : '';
  const bestillBadge = w.bestill ? '<span class="status-badge badge-bestill">Bestill</span>' : '';
  const anyBadge = harBadge || bestillBadge;
  const diceRow=w.expertScore?`<span class="card-dice-row">${diceSVG(w.expertScore,13)}<span style="font-size:9px;color:#9a8f84;font-weight:500;">${scoreTag(w)}</span></span>`:'';
  const profRow=profileCirclesHTML(w,true);
  const userStars=w.rating?`<span style="display:inline-flex;gap:1px;">${Array.from({length:6},(_,i)=>`<span style="font-size:10px;color:${i<w.rating?'#c8a830':'#e4dfd6'};">★</span>`).join('')}</span>`:'';
  const dragAttr=draggable?`draggable="true" data-id="${w.id}"`:'' ;
  const handle=draggable?`<div class="drag-handle" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);">⠿</div>`:'';
  // Softer glow on overview cards than in the modal (smaller image = harsher edge otherwise)
  const glow=`box-shadow:inset 0 0 20px rgba(${typeGlowRgb(w.type)},.30);`;
  return `<div class="wine-card" ${dragAttr} onclick="openModal(${w.id})" style="position:relative;">
    ${handle}
    <div class="card-img-area" style="${glow}">${imgAreaHTML(w,76)}</div>
    <div class="card-body">
      <div class="card-body-left">
        <div class="card-name">${w.name}</div>
        <div class="card-sub">${w.grape} · ${w.region}</div>
        <div style="display:flex;align-items:center;gap:6px;flex-wrap:wrap;">
          ${diceRow}${profRow?`<span>${profRow}</span>`:''}${userStars}
        </div>
        ${anyBadge?`<div class="card-status-row">${harBadge}${bestillBadge}</div>`:''}
      </div>
      <div class="card-footer">
        <span class="price-val">${w.price?Math.round(w.price)+' kr':'—'}</span>
        ${w.priceDate?`<span class="price-date">${w.priceDate}</span>`:''}
      </div>
    </div>
  </div>`;
}

/* ── DRAG AND DROP (custom sort) ── */
function initDrag(){
  document.querySelectorAll('.wine-card[draggable]').forEach(card=>{
    card.addEventListener('dragstart',e=>{
      dragSrcId=parseInt(card.dataset.id);
      card.classList.add('dragging');
      e.dataTransfer.effectAllowed='move';
    });
    card.addEventListener('dragend',()=>card.classList.remove('dragging'));
    card.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';card.classList.add('drag-over');});
    card.addEventListener('dragleave',()=>card.classList.remove('drag-over'));
    card.addEventListener('drop',e=>{
      e.preventDefault();card.classList.remove('drag-over');
      const targetId=parseInt(card.dataset.id);
      if(dragSrcId===targetId)return;
      // move dragSrcId to position of targetId in customOrder
      const srcIdx=customOrder.indexOf(dragSrcId);
      const tgtIdx=customOrder.indexOf(targetId);
      if(srcIdx<0||tgtIdx<0)return;
      customOrder.splice(srcIdx,1);
      customOrder.splice(tgtIdx,0,dragSrcId);
      saveLocal();
      render();
      pushOrderToFirebase().catch(()=>{/* badge speiler feilen */});
    });
  });
}

const EDIT_FIELD_IDS = ['ed-name','ed-grape','ed-region','ed-type','ed-price','ed-taste','ed-desc','ed-score','ed-src','ed-vmpid','ed-vivino','modal-note','ed-presentation'];
/* Read selected food chips from a chip container by id. Returns array of canonical names. */
function readFoodChips(containerId){
  const c=document.getElementById(containerId); if(!c) return [];
  return Array.from(c.querySelectorAll('.food-chip[data-on="1"]')).map(b=>b.dataset.food);
}
function toggleEditFoodChip(btn){ toggleFoodChipGeneric(btn); markDirty(); }
function toggleAddFoodChip(btn){ toggleFoodChipGeneric(btn); }
function toggleFilterFoodChip(btn){ toggleFoodChipGeneric(btn); }
function toggleFoodChipGeneric(btn){
  const on=btn.dataset.on==='1';
  if(on){
    btn.dataset.on='0';
    btn.style.background='#fff'; btn.style.color='#5c5248'; btn.style.borderColor='#e4dfd6';
  } else {
    btn.dataset.on='1';
    btn.style.background='#8B1A1A'; btn.style.color='#fff'; btn.style.borderColor='#8B1A1A';
  }
}
function captureEditFormValues(){
  if(!document.getElementById('ed-name')) return null;
  const out={};
  EDIT_FIELD_IDS.forEach(id=>{
    const el=document.getElementById(id);
    if(el) out[id]=el.value;
  });
  out._rating=editRating;
  out._food=readFoodChips('ed-food-chips');
  return out;
}
function restoreEditFormValues(captured){
  if(!captured) return;
  EDIT_FIELD_IDS.forEach(id=>{
    if(!(id in captured)) return;
    const el=document.getElementById(id);
    if(el) el.value=captured[id];
  });
  if('_rating' in captured){ editRating=captured._rating; renderStars(); }
  if('_food' in captured){
    const container=document.getElementById('ed-food-chips');
    if(container) container.innerHTML=foodChipsHTML(captured._food,'toggleEditFoodChip');
    const cnt=document.getElementById('ed-food-count');
    if(cnt) cnt.textContent=(captured._food||[]).length;
  }
}

async function saveEdit(wineId, closeAfter=false){
  const w=wines.find(x=>x.id===wineId);if(!w)return;
  // Show "Lagrer..." feedback
  const btn=document.getElementById('edit-save-btn');
  if(btn){btn.textContent='Lagrer...';btn.className='action-btn';btn.disabled=true;}
  // Use distinct name 'fv' (field value) to avoid shadowing wineId
  const fv=fieldId=>document.getElementById(fieldId)?.value.trim();
  const score=fv('ed-score');
  const oldPrice=w.price;
  // Use || w.x so empty string falls back to existing value (no clearing required fields)
  w.name     = fv('ed-name')   || w.name;
  w.grape    = fv('ed-grape')  || w.grape;
  w.region   = fv('ed-region') || w.region;
  w.type     = fv('ed-type')   || w.type;
  const newPrice=parseFloat(fv('ed-price'));
  if(newPrice) w.price=newPrice;
  w.taste    = fv('ed-taste')  || w.taste;
  w.food     = readFoodChips('ed-food-chips');
  w.desc     = fv('ed-desc')   !== undefined ? (document.getElementById('ed-desc')?.value ?? w.desc) : w.desc;
  w.expertScore  = score ? parseInt(score) : null;
  w.expertSource = fv('ed-src') || 'GV';
  const vmpNew=fv('ed-vmpid'); w.vmpId=vmpNew||null;
  const vivRaw=fv('ed-vivino');
  if(vivRaw){const m=vivRaw.match(/thumbs\/([^_]+)/);w.vivinoHash=m?m[1]:vivRaw;}else w.vivinoHash=null;
  // note: use raw value (not trimmed) to preserve whitespace
  w.note   = document.getElementById('modal-note')?.value ?? w.note;
  // presentation: same — preserve whitespace and line breaks
  w.presentation = document.getElementById('ed-presentation')?.value ?? w.presentation;
  w.rating = editRating;
  // if price was manually edited, update priceUpdatedAt
  if(newPrice && newPrice!==oldPrice) w.priceUpdatedAt=Date.now();
  isDirty=false;
  // Ensure "Lagrer..." is visible for at least ~600ms so the user can perceive the action,
  // even if save completes faster than that
  const minFeedback=new Promise(r=>setTimeout(r,600));
  await Promise.all([saveWine(w), minFeedback]);
  if(closeAfter){
    doCloseModal();
  } else {
    renderModal(w, false); // stay in modal, switch to view mode showing saved state
  }
}

}

function nowLabel(){
  const d=new Date();
  const months=['JAN','FEB','MAR','APR','MAI','JUN','JUL','AUG','SEP','OKT','NOV','DES'];
  return months[d.getMonth()]+String(d.getFullYear()).slice(2);
}

async function updatePricesFromVMP(){
  const btn=document.getElementById('update-prices-btn');
  if(!btn)return;
  btn.disabled=true;
  btn.textContent='Oppdaterer...';

  // Show status banner
  let banner=document.getElementById('update-banner');
  if(!banner){banner=document.createElement('div');banner.id='update-banner';document.querySelector('.container').insertBefore(banner,document.querySelector('.toolbar'));}
  const setBannerStatus=(msg,color='rgba(255,255,255,.4)')=>{
    banner.innerHTML=`<div style="font-size:11px;padding:8px 14px;background:rgba(255,255,255,.05);border-radius:10px;margin-bottom:10px;color:${color};">${msg}</div>`;
  };

  const total=wines.length;
  let updated=0, notFound=0, vmpFound=0;
  const dateLabel=nowLabel();

  for(let i=0;i<wines.length;i++){
    const w=wines[i];
    setBannerStatus(`⏳ Oppdaterer ${i+1}/${total}: ${w.name}...`);
    try{
      let searchQ=w.vmpId||w.name;
      const url=`https://www.vinmonopolet.no/vmpws/v2/vmp/products/search?fields=FULL&pageSize=1&currentPage=0&q=${encodeURIComponent(searchQ)}`;
      const data=await vmpFetch(url);
      const prod=(data.products||[])[0];
      if(prod&&prod.price?.value){
        const newPrice=prod.price.value;
        // Assign vmpId if missing and we found a match by name
        if(!w.vmpId&&prod.code){w.vmpId=prod.code;vmpFound++;}
        if(newPrice!==w.price) updated++;
        w.price=newPrice;
        w.priceDate=dateLabel;
        w.priceUpdatedAt=Date.now();
      } else {
        notFound++;
      }
    }catch(e){ notFound++; }
    await new Promise(r=>setTimeout(r,300));
  }

  // Push til Firebase via bulk multi-path update (én round-trip i stedet for N)
  setBannerStatus('⏳ Lagrer oppdaterte priser...');
  saveLocal();render();
  if(isOnline){
    try{
      await pushMultipleWinesToFirebase(wines);
      setBannerStatus(`✅ Ferdig! ${updated} priser endret · ${vmpFound} nye varenummer · ${notFound} ikke funnet`,'#5DCAA5');
    }catch(e){
      setBannerStatus(`⚠ Priser oppdatert lokalt, men skylagring feilet: ${e.message}`,'#EF9F27');
    }
  } else {
    setBannerStatus(`✅ Priser oppdatert lokalt (offline) — ${updated} endret`,'#5DCAA5');
  }

  btn.disabled=false;
  btn.textContent='↻ Oppdater priser';
  setTimeout(()=>{banner.innerHTML='';},8000);
}

/* ── MODAL CLOSE + BACK-BUTTON HIJACKING ──
 * Strategy: every overlay-like layer (modal, confirm dialogs, lightbox) pushes a
 * history entry. popstate closes the topmost layer in priority order. UI close
 * actions (Lukk button, ESC, click outside, "Nei avbryt", lightbox click) all route
 * through history.back() so the popstate handler is the single source of truth.
 * Programmatic closes (after save/delete) call doCloseModal which pops the tracked
 * overlay depth in one history.go() with a suppression flag.
 */
let inProgrammaticHistory=false;
let overlayDepth=0; // number of history entries we've pushed for overlays (modal/confirm/lightbox)
function pushAnchor() {history.pushState({app:'root'},'');}
function pushOverlay(){history.pushState({app:'overlay'},''); overlayDepth++;}

window.addEventListener('popstate', () => {
  if(inProgrammaticHistory){ inProgrammaticHistory=false; return; }
  overlayDepth=Math.max(0, overlayDepth-1);
  // Topmost layer first
  const lb=document.getElementById('lightbox-container');
  if(lb && lb.innerHTML){ lb.innerHTML=''; return; }
  const cc=document.getElementById('close-confirm');
  if(cc){cc.remove();return;}
  const dc=document.getElementById('delete-confirm');
  if(dc){dc.remove();return;}
  // Duplicate-dialog: clean its esc-listener too
  const dup=document.getElementById('duplicate-dialog');
  if(dup){
    if(dup._escHandler) document.removeEventListener('keydown', dup._escHandler);
    dup.remove();
    window._duplicateOnSaveDuplicate=null;
    return;
  }
  // Food filter overlay
  const ff=document.getElementById('food-filter-overlay');
  if(ff){ ff.remove(); return; }
  // Edit-mode food submenu (sits on top of modal — check before modal-overlay)
  const fs=document.getElementById('food-submenu-overlay');
  if(fs){ fs.remove(); return; }
  if(document.getElementById('modal-overlay')){
    if(isDirty){
      // Re-anchor the modal entry we just popped, then show the dirty-close dialog
      pushOverlay();
      confirmClose(doCloseModal);
      return;
    }
    doCloseModalNoHistory();
    return;
  }
  // At root — re-anchor so device back can't leave the app
  pushAnchor();
});

function doCloseModalNoHistory(){
  document.getElementById('modal-container').innerHTML='';
  const lb=document.getElementById('lightbox-container'); if(lb) lb.innerHTML='';
  const cc=document.getElementById('close-confirm');if(cc)cc.remove();
  const dc=document.getElementById('delete-confirm');if(dc)dc.remove();
  selectedId=null; isDirty=false;
}
function doCloseModal(){
  // Programmatic close (save/delete/dismiss): clear DOM and pop all our overlay entries
  doCloseModalNoHistory();
  if(overlayDepth>0){
    const d=overlayDepth;
    overlayDepth=0;
    inProgrammaticHistory=true;
    history.go(-d);
  }
}

function confirmClose(callback){

  const overlay=document.createElement('div');
  overlay.id='close-confirm';

    <div style="background:#fff;border-radius:14px;box-shadow:0 8px 32px rgba(0,0,0,0.22);padding:1.5rem;max-width:300px;width:100%;text-align:center;">

        <button class="action-btn red" style="font-size:13px;padding:9px 20px;" onclick="dismissConfirmClose()">Nei, forkast</button>
      </div>
    </div>`;
  document.body.appendChild(overlay);
  pushOverlay();
}
function dismissConfirmClose(){
  // User chose to discard changes — close confirm overlay AND modal together.
  const el=document.getElementById('close-confirm');if(el)el.remove();

function confirmSaveClose(){

  const el=document.getElementById('close-confirm');if(el)el.remove();
  if(selectedId!==null) saveEdit(selectedId, true); // closeAfter=true (user was trying to close)
}

function closeModal(e){
  // Lukk button, ESC, and click outside all go through history.back() — popstate handles dirty check + close.
  if(!e||e.target.id==='modal-overlay') history.back();
}
document.addEventListener('keydown',e=>{
  if(e.key!=='Escape') return;
  // Route all ESC presses through history.back so the popstate handler closes the topmost layer
  if(document.getElementById('lightbox-container')?.innerHTML ||
     document.getElementById('close-confirm') ||
     document.getElementById('delete-confirm') ||
     document.getElementById('modal-overlay')){

  }
});

        <select id="nw-source" style="font-size:11px;padding:4px 8px;border:1px solid #ddd;border-radius:6px;background:#fff;"><option value="GV">GV</option><option value="IT">IT — Ingvild Tennfjord</option></select>

function scheduleVmpSearch(){
  clearTimeout(vmpSearchTimer);
  const q=document.getElementById('nw-search')?.value.trim();
  const box=document.getElementById('nw-search-results');
  if(!q||q.length<2){if(box)box.style.display='none';return;}
  vmpSearchTimer=setTimeout(()=>doVmpSearch(q),400);
}

async function vmpFetch(url){
  const proxyUrl=`${VMP_PROXY}?url=${encodeURIComponent(url)}`;
  const res=await fetch(proxyUrl);
  if(!res.ok) throw new Error('HTTP '+res.status);
  const text=await res.text();
  if(text.trim().startsWith('<')){
    throw new Error('Fikk HTML — Worker ikke oppdatert ennå');
  }
  return JSON.parse(text);
}

function vmpTypeToLocal(t){
  if(!t) return 'red';
  const tl=t.toLowerCase();
  if(tl.includes('hvit')||tl.includes('white')) return 'white';
  if(tl.includes('ros')) return 'rose';
  return 'red';
}

async function doVmpSearch(q){
  const box=document.getElementById('nw-search-results');
  if(!box)return;
  box.style.display='block';
  box.innerHTML='<div style="padding:10px;font-size:12px;color:#888;">Søker...</div>';
  try{
    const data=await vmpFetch(`https://www.vinmonopolet.no/vmpws/v2/vmp/products/search?fields=FULL&pageSize=12&currentPage=0&q=${encodeURIComponent(q)}`);
    const products=data.productList?.results||data.products||[];
    if(!products.length){box.innerHTML='<div style="padding:10px;font-size:12px;color:#888;">Ingen viner funnet</div>';return;}
    box.innerHTML=products.map(p=>{
      const pid=p.code||'';
      const name=p.name||'Ukjent';
      const price=p.price?.value?Math.round(p.price.value)+' kr':'—';
      const country=p.main_country?.name||p.mainCountry?.name||'';
      const grape=(p.grapes||[]).map(g=>g.name).join('/');
      const img=pid?`${VMP_IMG}${pid}-1.jpg`:'';
      // Extract all available fields from search result
      const bc=p.basiccharacteristics||{};
      const food=migrateFood((p.readySteadyDrink||p.isGoodFor||p.content?.isGoodFor||[]).map(f=>f.name||f));
      const fylde    = bc.fullness    ??bc.fylde    ??p.fullness    ??null;
      const friskhet = bc.freshness   ??bc.friskhet ??p.freshness   ??null;
      const sodme    = bc.sweetness   ??bc.sodme    ??p.sweetness   ??null;
      const garve    = bc.bitterness  ??bc.tannins  ??bc.garvestoff ??null;
      const type     = vmpTypeToLocal(p.main_category?.name||p.mainCategory?.name||'');
      const region   = [p.district?.name,country].filter(Boolean).join(', ')||country;
      const searchData={name,grape,region,price:p.price?.value,food,type,fylde,friskhet,sodme,garve};
      const sdJson=JSON.stringify(searchData).replace(/"/g,'&quot;');
      return `<div onclick="selectVmpProduct('${pid}',JSON.parse(this.dataset.sd))" data-sd="${sdJson}"
        style="display:flex;align-items:center;gap:10px;padding:8px 12px;cursor:pointer;border-bottom:1px solid #f0ede8;transition:background .1s;color:#2a2520;"
        onmouseover="this.style.background='#f9f8f5'" onmouseout="this.style.background=''">
        ${img?`<img src="${img}" style="width:32px;height:44px;object-fit:contain;flex-shrink:0;" onerror="this.style.display='none'"/>`:'<div style="width:32px;flex-shrink:0;"></div>'}
        <div style="flex:1;min-width:0;">
          <div style="font-size:12px;font-weight:600;color:#1a1a1a;line-height:1.3;">${name}</div>
          <div style="font-size:10px;color:#888;">${grape?grape+' · ':''} ${country}</div>
        </div>
        <div style="font-size:12px;font-weight:600;color:#1a1a1a;white-space:nowrap;">${price}</div>
      </div>`;
    }).join('');
  }catch(e){
    box.innerHTML=`<div style="padding:10px;font-size:12px;color:#a32d2d;">Søk feilet: ${e.message}</div>`;
  }
}

// Convert VMP facet range "7-8" → midpoint integer (e.g. 7)
function facetToInt(code){
  if(!code) return null;
  const parts=code.split('-').map(Number);
  if(parts.length===2&&!isNaN(parts[0])) return parts[0]; // use lower bound
  const n=parseInt(code);
  return isNaN(n)?null:n;
}

// Parse profile values from facets array for a specific product code
function profileFromFacets(facets, pid){
  const result={fylde:null,friskhet:null,sodme:null,garve:null,food:null};
  if(!facets||!pid) return result;
  const map={
    'Fylde':            'fylde',
    'Friskhet':         'friskhet',
    'Soedme':           'sodme',
    'Tannin(Sulfates)': 'garve',
  };
  facets.forEach(f=>{
    // Profile values
    const key=map[f.code];
    if(key){
      const selected=(f.values||[]).find(v=>v.selected)||(f.values||[])[0];
      if(selected) result[key]=facetToInt(selected.code);
    }
    // Food/mat from isGoodfor facet
    if(f.code==='isGoodfor'){
      result.food=migrateFood((f.values||[]).map(v=>v.name));
    }
  });
  return result;
}

/* Set food chips in a container to match a given array of canonical food names.
 * Replaces chip HTML so all state is consistent (no half-toggled chips left behind). */
function setFoodChips(containerId, foodArray, onClickFn){
  const c=document.getElementById(containerId); if(!c) return;
  c.innerHTML=foodChipsHTML(foodArray||[], onClickFn);
}

async function selectVmpProduct(pid, searchData){
  // Duplicate check: if a wine with this vmpId already exists, ask user what to do
  const existing=pid?wines.find(w=>w.vmpId===pid):null;
  if(existing){
    showDuplicateDialog(existing, ()=>{
      // "Lagre duplikat": continue filling as normal
      fillVmpProductData(pid, searchData);
    });
    return;
  }
  fillVmpProductData(pid, searchData);
}

async function fillVmpProductData(pid, searchData){
  const box=document.getElementById('nw-search-results');
  const set=(id,v)=>{const el=document.getElementById(id);if(el&&v!=null&&v!=='')el.value=v;};

  // Fill fields from search data immediately
  set('nw-name',   searchData.name);
  set('nw-grape',  searchData.grape);
  set('nw-region', searchData.region);
  set('nw-vmpid',  pid);
  if(searchData.food&&searchData.food.length) setFoodChips('nw-food-chips', searchData.food, 'toggleAddFoodChip');
  if(searchData.price) set('nw-price', Math.round(searchData.price));
  const typeEl=document.getElementById('nw-type');
  if(typeEl) typeEl.value=searchData.type||'red';
  if(box) box.style.display='none';
  const badge=document.getElementById('nw-autofill-badge');
  if(badge) badge.style.display='inline';
  const searchEl=document.getElementById('nw-search');
  if(searchEl) searchEl.value=searchData.name;

  const profPreview=document.getElementById('nw-prof-preview');
  if(profPreview){ profPreview.textContent='⏳ Henter detaljer...'; profPreview.style.color='#888'; }

  try{
    // Search by product code — returns facets specific to this product
    const data = await vmpFetch(
      `https://www.vinmonopolet.no/vmpws/v2/vmp/products/search?fields=FULL&pageSize=1&currentPage=0&q=${encodeURIComponent(pid)}`
    );

    // Get product URL for HTML scraping (smak, mat, desc)
    const prod = (data.products||[])[0];
    const prodUrl = prod?.url ? `https://www.vinmonopolet.no${prod.url}` : null;

    // Extract profile from facets
    const prof = profileFromFacets(data.facets||[], pid);

    // Apply food from facets if we got more detailed data
    if(prof.food&&prof.food.length) setFoodChips('nw-food-chips', prof.food, 'toggleAddFoodChip');

    // Scrape product page HTML for smak and beskrivelse
    const set2=(id,v)=>{const el=document.getElementById(id);if(el&&v&&!el.value)el.value=v.trim();};
    if(prodUrl){
      try{
        const pageRes = await fetch(`${VMP_PROXY}?url=${encodeURIComponent(prodUrl)}`);
        if(pageRes.ok){
          const html = await pageRes.text();
          // Confirmed structure: <span>Smak</span><span>VALUE</span>
          const smakM = html.match(/<span>Smak<\/span><span>([^<]+)<\/span>/);
          const luktM = html.match(/<span>Lukt<\/span><span>([^<]+)<\/span>/);
          if(smakM) set2('nw-taste', smakM[1]);
          if(luktM) set2('nw-desc',  luktM[1]);
        }
      }catch(e){ /* HTML scraping failed silently */ }
    }

    window._vmpProfile=prof;

    if(profPreview){
      const type=searchData.type||'red';
      const vals=[
        prof.fylde   !=null?`FYL ${prof.fylde}/12`:'',
        prof.friskhet!=null?`FRI ${prof.friskhet}/12`:'',
        prof.sodme   !=null&&type!=='red'?`SØD ${prof.sodme}/12`:'',
        prof.garve   !=null&&type==='red' ?`GAR ${prof.garve}/12`:'',
      ].filter(Boolean).join(' · ');
      profPreview.textContent=vals?'✓ Profil: '+vals:'(Ingen profilverdier funnet)';
      profPreview.style.color=vals?'#2d6a2d':'#888';
    }
  }catch(e){
    window._vmpProfile={};
    if(profPreview){ profPreview.textContent='⚠ Henting feilet: '+e.message; profPreview.style.color='#996600'; }
  }
}

async function addManualWine(){
  const name=document.getElementById('nw-name').value.trim();if(!name){alert('Navn er påkrevd.');return;}
  const vmpIdRaw=document.getElementById('nw-vmpid').value.trim()||null;
  // Duplicate check: vmpId first (stronger ID), fall back to exact name match
  let existing=null;
  if(vmpIdRaw) existing=wines.find(w=>w.vmpId===vmpIdRaw);
  if(!existing) existing=wines.find(w=>(w.name||'').toLowerCase().trim()===name.toLowerCase());
  if(existing){
    showDuplicateDialog(existing, ()=>commitManualWine(name,vmpIdRaw));
    return;
  }
  commitManualWine(name, vmpIdRaw);
}

async function commitManualWine(name, vmpIdRaw){
  const vivRaw=document.getElementById('nw-vivino').value.trim();let vivinoHash=null;
  if(vivRaw){const m=vivRaw.match(/thumbs\/([^_]+)/);vivinoHash=m?m[1]:vivRaw;}
  const score=document.getElementById('nw-score').value;
  const prof=window._vmpProfile||{};
  const food=readFoodChips('nw-food-chips');
  const newWine={
    id:nextId(),name,
    grape:  document.getElementById('nw-grape').value.trim()||'—',
    region: document.getElementById('nw-region').value.trim()||'—',
    type:   document.getElementById('nw-type').value,
    price:  parseFloat(document.getElementById('nw-price').value)||null,
    priceDate: nowLabel(),
    priceUpdatedAt: Date.now(),
    vmpId:  vmpIdRaw,
    vivinoHash,
    taste:  document.getElementById('nw-taste').value.trim()||'—',
    food,
    expertScore:  score?parseInt(score):null,
    expertSource: document.getElementById('nw-source').value,
    desc:   document.getElementById('nw-desc').value.trim()||'',
    note:'', rating:0, updatedAt:Date.now(),
    // Profile values from VMP if available
    ...(prof.fylde!=null    && {fylde:    prof.fylde}),
    ...(prof.friskhet!=null && {friskhet: prof.friskhet}),
    ...(prof.sodme!=null    && {sodme:    prof.sodme}),
    ...(prof.garve!=null    && {garvestoff: prof.garve}),
  };
  window._vmpProfile=null;
  showManual=false;document.getElementById('add-form-container').style.display='none';document.getElementById('add-form-container').innerHTML='';
  await saveWine(newWine);
}

/* ── BOOT ── */
function seedDefaultsLocally(){
  // Brukes når Firebase ikke er tilgjengelig og lokalstate er tom — sørger for at
  // brukeren ser noe i UI. Skrives ikke til Firebase her (det gjøres av seedDefaultsToFirebase
  // når vi er online og databasen er tom).
  const now=Date.now();
  wines=defaultWines.map(w=>{ const copy={...w}; migrateWine(copy); copy.updatedAt=now; return copy; });
  customOrder=wines.map(w=>w.id);
  ensureOrder(); saveLocal(); render();
}

/* Kjøres når brukeren er logget inn (enten ved oppstart med eksisterende session,
 * eller etter signInWithGoogle). Setter opp listeners og seeder om nødvendig. */
async function startAuthenticatedSession(user){
  currentUser = user;
  hideLoginScreen();
  loadLocal();
  ensureOrder();
  render();
  refreshBadge();
  // Sjekk om Firebase er tom og seed defaults hvis så er tilfelle.
  // Vi gjør dette FØR vi kobler til listeners for å unngå at en tom snapshot
  // kommer først og blanker UI-et.
  try{
    const snap = await fbDb.ref('wines').once('value');
    const v = snap.val();
    const isEmpty = !v || (typeof v === 'object' && Object.keys(v).length === 0);
    if(isEmpty){
      console.log('[firebase] tom database — seeder default-viner');
      await seedDefaultsToFirebase();
    }
  }catch(e){
    console.error('[firebase] init-sjekk feilet', e);
    // Fortsetter likevel — listener vil vise oss hva som finnes
  }
  attachListeners();
}

function startUnauthenticatedSession(){
  currentUser = null;
  detachListeners();
  showLoginScreen();
  refreshBadge();
}

async function init(){
  pushAnchor(); // back-button-anker så enheten ikke kan navigere bort fra appen
  // Lytt på auth-state. Denne fyrer umiddelbart med eksisterende session (eller null)
  // og deretter hver gang brukeren logger inn/ut.
  fbAuth.onAuthStateChanged(async user => {
    if(user){
      await startAuthenticatedSession(user);
    } else {
      startUnauthenticatedSession();
    }
  });
}
init();
